name: Android APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using Android SDK at $SDK_ROOT"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK 36
        run: sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build web layer
        run: npm run build

      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: ./android/gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Optional NVIDIA API smoke test
        working-directory: .
        if: env.NVIDIA_API_KEY != ''
        run: |
          python - <<'PY'
          import os, urllib.request
          req = urllib.request.Request(
              os.environ["NVIDIA_BASE_URL"] + "/models",
              headers={"Authorization": "Bearer " + os.environ["NVIDIA_API_KEY"]},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status != 200:
                  raise SystemExit(f"NVIDIA /v1/models returned {response.status}")
              print("NVIDIA NIM API smoke test: OK")
          PY

      - name: Rename APK
        working-directory: .
        run: cp apps/client/android/app/build/outputs/apk/debug/app-debug.apk "NIM-Hub-${{ github.ref_name }}.apk"

      - name: Publish raw APK to GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "${TAG}" == v* ]]; then
            gh release create "${TAG}" "NIM-Hub-${TAG}.apk" --generate-notes --title "NIM Hub ${TAG}"
          else
            gh release create "android-build-${{ github.run_number }}" "NIM-Hub-${TAG}.apk" --target "${{ github.sha }}" --prerelease --title "NIM Hub Android build ${{ github.run_number }}" --notes "Manual Android APK build from ${{ github.sha }}."
          fi
