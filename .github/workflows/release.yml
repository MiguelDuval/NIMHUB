name: Release client

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        working-directory: apps/client
        run: npm install && npm run build
      - name: Package client
        run: tar -czf nim-hub-client-${{ github.ref_name }}.tar.gz -C apps/client dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "nim-hub-client-${{ github.ref_name }}.tar.gz" --generate-notes
