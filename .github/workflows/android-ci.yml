name: Android APK CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using Android SDK at $SDK_ROOT"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK 36
        run: sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build web layer
        run: npm run build

      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && bash gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/NIM-Hub.apk"

      - name: Publish APK artifact
        id: apk
        uses: actions/upload-artifact@v7
        with:
          path: NIM-Hub.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Add APK download link to run summary
        if: always()
        working-directory: .
        run: |
          echo '## Android APK' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.apk.outputs.artifact-url }}" ]; then
            echo '[⬇️ Download APK](${{ steps.apk.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'APK artifact was not published.' >> "$GITHUB_STEP_SUMMARY"
          fi

  gateway:
    name: Gateway tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e '.[test]'
      - name: Test
        run: pytest -q


  github-mcp-smoke:
    name: GitHub MCP smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/gateway
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${{ github.token }}
      GITHUB_TOOLSETS: repos
      MCP_SERVERS_JSON: >-
        {"servers":[{"id":"github","transport":"stdio","permission":"read",
        "command":"docker","args":["run","-i","--rm",
        "-e","GITHUB_PERSONAL_ACCESS_TOKEN","-e","GITHUB_TOOLSETS",
        "-e","GITHUB_READ_ONLY=1","ghcr.io/github/github-mcp-server"],
        "env_vars":{"GITHUB_PERSONAL_ACCESS_TOKEN":"GITHUB_PERSONAL_ACCESS_TOKEN",
        "GITHUB_TOOLSETS":"GITHUB_TOOLSETS"}}]}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e '.[test]'
      - name: Start gateway
        run: |
          nohup python -m uvicorn nimhub_gateway.main:app             --host 127.0.0.1 --port 8787             > /tmp/nimhub-gateway.log 2>&1 &
          echo $! > /tmp/nimhub-gateway.pid
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(60):
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:8787/api/health",
                      timeout=2,
                  ):
                      break
              except Exception:
                  time.sleep(1)
          else:
              print(open("/tmp/nimhub-gateway.log", encoding="utf-8").read())
              raise SystemExit("gateway did not become ready")
          PY
      - name: Run GitHub MCP smoke
        run: python tests/smoke_github_mcp.py
      - name: Stop gateway
        if: always()
        run: |
          if [ -f /tmp/nimhub-gateway.pid ]; then
            kill "$(cat /tmp/nimhub-gateway.pid)" || true
          fi
          if [ -f /tmp/nimhub-gateway.log ]; then
            tail -n 100 /tmp/nimhub-gateway.log || true
          fi
