name: Build artifacts

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  client-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        working-directory: apps/client
        run: npm install && npm run build
      - name: Package PWA build
        run: tar -czf nim-hub-client-${{ github.sha }}.tar.gz -C apps/client dist
      - uses: actions/upload-artifact@v4
        with:
          name: nim-hub-client-${{ github.sha }}
          path: nim-hub-client-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
